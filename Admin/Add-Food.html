<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./asset/css/Add-Food.css" />
    <title>ADD FOOD</title>
</head>

<body>
    <div class="container">
        <!-- sidebar -->
        <div class="body-left">
            <h2>ADMIN PANEL</h2>
            <ul>
                <button id="logoutButton" type="submit"
                    style="color: #fff; background-color: transparent; border: none; text-decoration: underline; cursor: pointer;">
                    Logout
                </button>
                <a href="./Add-poster.html">
                    <li>Add Poster</li>
                </a>
                <a href="./Add-Category-food.html">
                    <li>Add Category Food</li>
                </a>
                <a href="./Add-Food.html">
                    <li>Add Food</li>
                </a>
                <li id="order">
                    <a href="">Order management</a>
                    <ul class="menu-dacap">
                        <li><a href="./Order-management-party.html">Party</a></li>
                        <li><a href="./Order-management-order.html">Order</a></li>
                    </ul>
                </li>
            </ul>
        </div>

        <!-- main content -->
        <div class="body-right">
            <div class="header">
                <img src="./asset/img/logo.png" alt="Logo" style="width: 100px;" />
            </div>
            <div class="body">
                <div class="content">
                    <div class="content-left">
                        <p>Enter image URL:</p>
                        <p>Enter the name of food:</p>
                        <p>Enter the price:</p>
                        <p>Enter Category:</p>
                    </div>
                    <div class="content-right">
                        <form method="post" action="https://backendspringfoodweb.onrender.com/api/v1/auth/foods/add">
                            <p>
                                <input type="text" name="image_food" placeholder="Enter image URL" required>
                            </p>
                            <p>
                                <input type="text" name="name_food" placeholder="Name of food" required>
                            </p>
                            <p>
                                <input type="number" step="0.01" name="price" placeholder="Price" required>
                            </p>
                            <p>
                                <label for="category">Category:</label>
                                <select id="category" name="id_categories" required>
                                    <!-- Dynamic options -->
                                </select>
                            </p>
                            <div class="bnt">
                                <center>
                                    <button class="Add-bnt" type="submit">ADD</button>
                                </center>
                            </div>
                        </form>
                    </div>
                    <div id="Result">
                        <table border="1">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Image</th>
                                    <th>Price</th>
                                    <th>Category</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="food-table-body">
                                <!-- Dynamic rows will be inserted here via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to handle dynamic content and actions -->
    <script src="../auth/logout.js"></script>
    <script src="../auth/auth.js"></script>
    <script>
        let categoriesMap = {}; // Biến toàn cục để ánh xạ categoryId -> name

        async function fetchCategories() {
            try {
                const response = await fetch('https://backendspringfoodweb.onrender.com/api/v1/auth/categories');
                const categories = await response.json();
                const categorySelect = document.getElementById('category');

                categorySelect.innerHTML = ''; // Clear existing options

                categories.forEach(category => {
                    // Lưu vào biến ánh xạ
                    categoriesMap[category.idCategories] = category.nameCategories;

                    // Hiển thị trong form select
                    const option = document.createElement('option');
                    option.value = category.idCategories;
                    option.textContent = category.nameCategories;
                    categorySelect.appendChild(option);
                });

                // Sau khi load xong category, mới fetch food
                fetchFoods();

            } catch (error) {
                console.error('Error fetching categories:', error);
            }
        }

        async function fetchFoods() {
            try {
                const response = await fetch('https://backendspringfoodweb.onrender.com/api/v1/auth/foods');
                const foods = await response.json();
                const tableBody = document.getElementById('food-table-body');

                tableBody.innerHTML = ''; // Clear existing rows
                foods.forEach(food => {
                    const categoryName = categoriesMap[food.categoryId] || 'Unknown';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${food.idFood}</td>
                        <td>${food.nameFood}</td>
                        <td><img src="${food.imageFood}" alt="Food Image" style="max-width: 100px; max-height: 100px;"></td>
                        <td>${food.price}</td>
                        <td>${categoryName}</td>
                        <td>
                            <form method="get" action="./edit-food-form.html">
                                <input type="hidden" name="id_food" value="${food.idFood}">
                                <button class="change-btn" type="submit">EDIT</button>
                            </form>
                            <button class="change-btn" onclick="deleteFood(${food.idFood})">DELETE</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching foods:', error);
            }
        }

        // Chạy khi trang load
        fetchCategories(); // fetchFoods sẽ được gọi sau khi fetchCategories xong

        async function deleteFood(id) {
            if (!confirm("Are you sure you want to delete this food?")) return;

            try {
                const response = await fetch(`https://backendspringfoodweb.onrender.com/api/v1/auth/foods/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Food deleted successfully');
                    fetchFoods(); // Refresh the table
                } else if (response.status === 404) {
                    alert('Food not found');
                } else {
                    alert('Failed to delete food');
                }
            } catch (error) {
                console.error('Error deleting food:', error);
                alert('Error deleting food');
            }
        }
    </script>
</body>

</html>
